# 領域クラスター別の X アカウント。tools/post_x.py が読む。
# 鍵は書かない。各アカウントの鍵は .env に <env_prefix>_ACCESS_TOKEN / <env_prefix>_ACCESS_SECRET として置く。
# アプリ(Developer Portal)の鍵は X_CONSUMER_KEY / X_CONSUMER_SECRET(全アカウント共通)。
# アクセストークンは tools/x_authorize.py --cluster <key> で取得する(ブラウザで各アカウントとしてログインして PIN を入力)。

defaults:
  posts_per_day: 2          # 1 アカウントあたりの 1 日の投稿数
  new_article_days: 14      # この日数以内に公開した記事を「新着」として優先する
  hashtags_max: 2

accounts:
  - cluster: cognition
    display_name: "認知・心理・脳の研究アトラス"
    handle: "rsch_cognition"              # 例: ResearcherCog(@ は不要)。未設定でも鍵があれば投稿する
    env_prefix: X_COGNITION
    hashtags: ["#認知科学", "#AI"]
    enabled: true
  - cluster: economics
    display_name: "行動経済・経済・金融の研究アトラス"
    handle: "rsch_economics"
    env_prefix: X_ECONOMICS
    hashtags: ["#行動経済学", "#AI"]
    enabled: true
  - cluster: organization
    display_name: "組織・経営・リーダーシップの研究アトラス"
    handle: "rsch_org"
    env_prefix: X_ORGANIZATION
    hashtags: ["#組織論", "#AI経営"]
    enabled: true
  - cluster: society
    display_name: "社会・制度・哲学・歴史の研究アトラス"
    handle: "rsch_society"
    env_prefix: X_SOCIETY
    hashtags: ["#社会学", "#AI"]
    enabled: true
  - cluster: systems
    display_name: "複雑系・システム・進化の研究アトラス"
    handle: "rsch_systems"
    env_prefix: X_SYSTEMS
    hashtags: ["#複雑系", "#AI"]
    enabled: true
  - cluster: ai
    display_name: "AI ガバナンスと協調の研究アトラス"
    handle: "rsch_ai_gov"
    env_prefix: X_AI
    hashtags: ["#AIガバナンス", "#AI"]
    enabled: true
