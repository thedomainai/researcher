# =============================================================================
# AI Native 社会・組織・システム設計のための研究情報源
# =============================================================================
# 目的: AGI時代に示唆を与える不変原理・構造的知見を収集する
# 対象: Tier 1論文、システマティックレビュー、メタアナリシス
# =============================================================================

# ---------------------------------------------------------------------------
# ティア分類フィルタ
# ---------------------------------------------------------------------------
tier_classification:
  tier1:
    label: "不変原理"
    description: "対象（人間/AI/組織）を入れ替えても成立する構造的原理・メカニズム"
    filters:
      abstraction_test: true
      constraint_invariance_test: true
      mechanism_test: true
    invariant_constraints:
      - "情報の不完全性（全知は物理的に不可能）"
      - "計算資源の有限性（AIも無限ではない）"
      - "因果関係の不可逆性（時間は一方向）"
      - "複数主体間の利害の不一致"
      - "複雑系における創発と予測不可能性"
      - "エントロピー増大と秩序維持のコスト"

  tier2:
    label: "消滅制約の分析"
    description: "AI時代に外れる制約を特定し、その除去が何を引き起こすかを推論するための材料"
    vanishing_constraints:
      - "人間のワーキングメモリ容量（7±2）"
      - "1日24時間の労働時間制約"
      - "言語の壁"
      - "情報伝達の遅延（組織階層の伝言ゲーム）"
      - "専門知識の属人性"
      - "人間の注意資源の有限性"

  tier3:
    label: "スキップ"
    description: "特定条件下の現象記述、手法レベルの最適化研究"
    skip_indicators:
      - "特定UIでのA/Bテスト結果"
      - "特定ナッジの効果測定"
      - "経験則的な数値（管理スパン等）のみを報告"
      - "再現困難な単一実験の結果報告"

  # 物理の分野(research_domains で field: "physics" のもの)だけに使う基準(2026-11-26)。
  # 上の基準は「AI 時代の設計に通じるか」で仕分けるため、物理の観測結果や個別理論の進展が
  # Tier 3 に落ちる。物理では研究結果そのものも記事にするので、基準を分ける。
  # 判定の指示文は tools/tier_classify_cli.py の PHYSICS_CRITERIA。
  physics:
    tier1: "基礎法則・原理的な制約。自然の基礎法則、または情報・計算・因果・エントロピーに関わる原理的な制約を、仕組みとともに示す。個別の模型の解析や個別の測定値は、質が高くても Tier 2"
    tier2: "重要な研究結果。分野の理解を前に進める観測・実験の結果、統合解析、個別理論の進展、総説"
    tier3: "スキップ。装置・解析手法・数値計算の小さな改良、材料や素子の性能向上、一般的な結論の無い個別計算、分野外、主流の物理と整合しない自称理論"

# ---------------------------------------------------------------------------
# 論文タイプフィルタ
# ---------------------------------------------------------------------------
paper_type_filter:
  include:
    - "systematic_review"
    - "meta_analysis"
    - "tier1_primary"
    - "seminal_paper"
    - "theoretical_framework"
  exclude:
    - "case_study_single"
    - "tool_benchmark"
    - "incremental_improvement"

# ---------------------------------------------------------------------------
# 物理の範囲(2026-11-26)
# ---------------------------------------------------------------------------
# 分母は PhySH(米国物理学会の分類)の 17 分野と arXiv の物理系カテゴリ。
# 17 分野のそれぞれが、どの分野で受けるか、対象外かを physh_map に書く。
physics_scope:
  purpose: "物理そのものを理解することと、情報・計算・因果・エントロピーというAI 時代にも変わらない制約の根拠を物理から得ること(2026-11-26 仮置き)"
  axis_rule: "分野は「対象」(何を調べるか)で切る。数理物理学と計算物理学だけは「方法」の分野で、特定の対象について物理的な結論を出す論文は対象の分野に置き、方法そのもの(定理・証明・アルゴリズム・計算量)が成果の論文だけを方法の分野に置く"
  sources:
    - "https://physh.org/browse (分野 17)"
    - "https://arxiv.org/category_taxonomy"
  physh_map:
    - {discipline: "Quantum Information, Science & Technology", handled_by: "quantum_mechanics", note: ""}
    - {discipline: "Gravitation, Cosmology & Astrophysics", handled_by: "relativity, cosmology_astrophysics", note: ""}
    - {discipline: "Particles & Fields", handled_by: "particle_physics_qft, string_theory", note: ""}
    - {discipline: "Statistical Physics & Thermodynamics", handled_by: "statistical_physics", note: ""}
    - {discipline: "Condensed Matter, Materials & Applied Physics", handled_by: "condensed_matter", note: "材料開発・デバイス応用は対象外"}
    - {discipline: "Nonlinear Dynamics", handled_by: "complexity_science", note: "既存の複雑系科学で受ける"}
    - {discipline: "Networks", handled_by: "complexity_science", note: "既存の複雑系科学で受ける"}
    - {discipline: "Interdisciplinary Physics", handled_by: "complexity_science", note: "既存の複雑系科学で受ける"}
    - {discipline: "Atomic, Molecular & Optical", handled_by: "対象外", note: "量子論の基礎に関わる実験は quantum_mechanics で拾う"}
    - {discipline: "Nuclear Physics", handled_by: "対象外", note: "基礎法則より個別の核種・反応の記述が中心"}
    - {discipline: "Fluid Dynamics", handled_by: "対象外", note: "古典物理の応用が中心"}
    - {discipline: "Plasma Physics", handled_by: "対象外", note: "古典物理の応用が中心"}
    - {discipline: "Polymers & Soft Matter", handled_by: "対象外", note: "個別の物質系の記述が中心"}
    - {discipline: "Physics of Living Systems", handled_by: "対象外", note: "生物側の既存分野に近い"}
    - {discipline: "Accelerators & Beams", handled_by: "対象外", note: "装置の技術"}
    - {discipline: "Energy Science & Technology", handled_by: "対象外", note: "応用技術"}
    - {discipline: "Physics Education Research", handled_by: "対象外", note: "教育研究"}

