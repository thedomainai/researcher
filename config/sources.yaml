# ---------------------------------------------------------------------------
# 品質フィルタリング
# ---------------------------------------------------------------------------
quality:
  freshness_half_life_days: 365
  min_relevance_score: 0.3

  tier_classification_prompt: |
    以下の論文について、AI nativeな社会・組織・システム設計への有用性を評価してください。

    タイトル: {title}
    アブストラクト: {abstract}

    以下の3つのテストを適用してください:

    1. 抽象度テスト: この知見から具体的な対象（人間、現在の技術、現在の制度）を除去しても成立するか？
    2. 制約不変テスト: この知見が依拠している制約条件は、AGI時代にも存続するか？
    3. メカニズムテスト: この研究は「なぜ」を説明しているか、それとも「何が起きたか」を記述しているだけか？

    分類:
    - Tier 1（不変原理）: 3テスト全てを満たす
    - Tier 2（消滅制約の分析）: テスト2で「消滅する制約」に依拠するが、その制約の構造的分析として価値がある
    - Tier 3（スキップ）: 条件依存的な現象記述または手法レベルの最適化

    JSON形式で回答:
    {"tier": 1|2|3, "reasoning": "判定理由", "key_insight": "核心的知見の1行要約"}

  paper_type_detection:
    systematic_review:
      title_keywords: ["systematic review", "scoping review", "literature review", "survey"]
      abstract_keywords: ["PRISMA", "systematic search", "inclusion criteria", "excluded studies"]
    meta_analysis:
      title_keywords: ["meta-analysis", "meta analysis", "quantitative synthesis"]
      abstract_keywords: ["effect size", "pooled estimate", "heterogeneity", "forest plot", "random effects"]
    seminal:
      min_citations: 500
      min_influential_citations: 50
