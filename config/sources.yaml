# =============================================================================
# AI Native 社会・組織・システム設計のための研究情報源
# =============================================================================
# 目的: AGI時代に示唆を与える不変原理・構造的知見を収集する
# 対象: Tier 1論文、システマティックレビュー、メタアナリシス
# =============================================================================

# ---------------------------------------------------------------------------
# ティア分類フィルタ
# ---------------------------------------------------------------------------
# 取得した論文をLLMが自動分類するための基準
tier_classification:
  # Tier 1: 不変原理 — AGI時代でもそのまま適用可能な構造的原理
  tier1:
    label: "不変原理"
    description: "対象（人間/AI/組織）を入れ替えても成立する構造的原理・メカニズム"
    filters:
      # 抽象度テスト: 具体的な対象を除去しても知見が成立するか
      abstraction_test: true
      # 制約不変テスト: 依拠する制約がAGI時代にも存続するか
      constraint_invariance_test: true
      # メカニズムテスト: 「なぜ」を説明しているか（「何が起きたか」ではなく）
      mechanism_test: true
    # 存続する制約の例（これらに依拠する知見はTier 1候補）
    invariant_constraints:
      - "情報の不完全性（全知は物理的に不可能）"
      - "計算資源の有限性（AIも無限ではない）"
      - "因果関係の不可逆性（時間は一方向）"
      - "複数主体間の利害の不一致"
      - "複雑系における創発と予測不可能性"
      - "エントロピー増大と秩序維持のコスト"

  # Tier 2: 消滅制約の分析 — AI時代に外れる制約とその効果の研究
  tier2:
    label: "消滅制約の分析"
    description: "AI時代に外れる制約を特定し、その除去が何を引き起こすかを推論するための材料"
    # 消滅する制約の例
    vanishing_constraints:
      - "人間のワーキングメモリ容量（7±2）"
      - "1日24時間の労働時間制約"
      - "言語の壁"
      - "情報伝達の遅延（組織階層の伝言ゲーム）"
      - "専門知識の属人性"
      - "人間の注意資源の有限性"

  # Tier 3: スキップ — 取得しない
  tier3:
    label: "スキップ"
    description: "特定条件下の現象記述、手法レベルの最適化研究"
    skip_indicators:
      - "特定UIでのA/Bテスト結果"
      - "特定ナッジの効果測定"
      - "経験則的な数値（管理スパン等）のみを報告"
      - "再現困難な単一実験の結果報告"

# ---------------------------------------------------------------------------
# 論文タイプフィルタ
# ---------------------------------------------------------------------------
paper_type_filter:
  # 取得対象とする論文タイプ
  include:
    - "systematic_review"     # システマティックレビュー
    - "meta_analysis"         # メタアナリシス
    - "tier1_primary"         # Tier 1判定されたプライマリ研究
    - "seminal_paper"         # 分野を定義した重要論文（被引用数上位）
    - "theoretical_framework" # 理論的フレームワークを提案する論文
  # 除外
  exclude:
    - "case_study_single"     # 単一ケーススタディ
    - "tool_benchmark"        # ツール/ベンチマーク比較のみ
    - "incremental_improvement" # 既存手法の微小改善

# ---------------------------------------------------------------------------
# 分野別検索クエリ（15分野 × Semantic Scholar + arXiv）
# ---------------------------------------------------------------------------
research_domains:

  # ===== 基礎科学 =====

  neuroscience:
