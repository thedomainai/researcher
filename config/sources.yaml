# =============================================================================
# AI Native 社会・組織・システム設計のための研究情報源
# =============================================================================
# 目的: AGI時代に示唆を与える不変原理・構造的知見を収集する
# 対象: Tier 1論文、システマティックレビュー、メタアナリシス
# =============================================================================

# ---------------------------------------------------------------------------
# ティア分類フィルタ
# ---------------------------------------------------------------------------
tier_classification:
  tier1:
    label: "不変原理"
    description: "対象（人間/AI/組織）を入れ替えても成立する構造的原理・メカニズム"
    filters:
      abstraction_test: true
      constraint_invariance_test: true
      mechanism_test: true
    invariant_constraints:
      - "情報の不完全性（全知は物理的に不可能）"
      - "計算資源の有限性（AIも無限ではない）"
      - "因果関係の不可逆性（時間は一方向）"
      - "複数主体間の利害の不一致"
      - "複雑系における創発と予測不可能性"
      - "エントロピー増大と秩序維持のコスト"

  tier2:
    label: "消滅制約の分析"
    description: "AI時代に外れる制約を特定し、その除去が何を引き起こすかを推論するための材料"
    vanishing_constraints:
      - "人間のワーキングメモリ容量（7±2）"
      - "1日24時間の労働時間制約"
      - "言語の壁"
      - "情報伝達の遅延（組織階層の伝言ゲーム）"
      - "専門知識の属人性"
      - "人間の注意資源の有限性"

  tier3:
    label: "スキップ"
    description: "特定条件下の現象記述、手法レベルの最適化研究"
    skip_indicators:
      - "特定UIでのA/Bテスト結果"
      - "特定ナッジの効果測定"
      - "経験則的な数値（管理スパン等）のみを報告"
      - "再現困難な単一実験の結果報告"

# ---------------------------------------------------------------------------
# 論文タイプフィルタ
# ---------------------------------------------------------------------------
paper_type_filter:
  include:
    - "systematic_review"
    - "meta_analysis"
    - "tier1_primary"
    - "seminal_paper"
    - "theoretical_framework"
  exclude:
    - "case_study_single"
    - "tool_benchmark"
    - "incremental_improvement"

