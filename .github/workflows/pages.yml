name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/concepts/**"
      - "wiki/_meta/**"
      - "raw/index.jsonl"
      - "config/site.yaml"
      - "config/sources.yaml"
      - "tools/build_site.py"
      - "tools/indexnow.py"
      - "config/site_assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "IndexNow へ全 URL を通知する"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 記事の公開日・更新日を git log から取るため全履歴が要る
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  notify:
    # 配置が終わってから、更新した URL を IndexNow(Bing 等)へ通知する。失敗しても公開には影響させない
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/indexnow.py ${{ inputs.indexnow_all && '--all' || '--since-days 3' }}
